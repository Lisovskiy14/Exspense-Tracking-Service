services:
  backend:
    build:
      context: .
    image: expense-tracking-service-image
    container_name: expense-tracking-service-backend
    ports:
      - "8080:8080"
    restart: unless-stopped
    depends_on:
      - db
  db:
    image: postgres
    container_name: expense-tracking-service-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_PASSWORD: root
      POSTGRES_USER: root
      POSTGRES_DB: expense-tracking-service-db